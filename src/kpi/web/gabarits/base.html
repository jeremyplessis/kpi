<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Suivi d'activité{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Red+Hat+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/static/chart.umd.min.js"></script>
  <style>
    :root {
      /* Palette charte graphique Cécile Plessis Photographe (nov. 2026) */
      --jaune: #ECD981;        /* 01 jaune, nuances #F1EAC9 / #F1E3A1 / #DAB941 */
      --bleu: #C1D3CE;         /* 02 bleu, nuances #E3E8E3 / #D1DEDB / #92AFA6 */
      --vert-clair: #D1CF95;   /* 03 vert clair, nuances #E8E6D0 / #DDDBB2 / #ABA857 */
      --vert: #879675;         /* 04 vert, nuances #D0D3C5 / #ABB59D / #475836 */
      --beige: #F4F2ED;        /* 05 beige, nuances #FBFBF9 / #EAE6DC */
      --sapin: #353F38;        /* 06 sapin, nuances #B4B6B1 / #757B74 / #0B100C */
      --sapin-fonce: #0B100C;
      --sapin-doux: #757B74;
      --vert-fonce: #475836;
      --bord-clair: #D0D3C5;

      --encre: var(--sapin);
      --encre-doux: var(--sapin-doux);
      --fond: var(--beige);
      --carte: #FBFBF9;
      --bord: var(--bord-clair);
      --accent: var(--vert-fonce);
      --accent-fonce: var(--sapin);
      --succes-fond: #E8E6D0;
      --succes-bord: #ABA857;
      --succes-texte: var(--vert-fonce);
      --erreur-fond: #EAE6DC;
      --erreur-bord: var(--sapin-doux);
      --erreur-texte: var(--sapin-fonce);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Red Hat Display", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--encre);
      background-color: var(--fond);
      /* Motif papier millimétré de la charte, en arrière-plan subtil */
      background-image:
        linear-gradient(rgba(135, 150, 117, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(135, 150, 117, .07) 1px, transparent 1px);
      background-size: 24px 24px;
      line-height: 1.5;
    }
    h1, h2 { font-family: "Fraunces", Georgia, "Times New Roman", serif; }
    .conteneur { max-width: 1240px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    header.entete {
      display: flex; align-items: baseline; gap: .75rem;
      padding: .25rem 0 1.25rem; flex-wrap: wrap;
    }
    header.entete h1 { font-size: 1.35rem; margin: 0; letter-spacing: .01em; }
    header.entete h1 .pictogramme {
      width: 1.15em; height: 1.15em; vertical-align: -.18em; margin-right: .35rem;
    }
    header.entete .sous-titre { color: var(--encre-doux); font-size: .9rem; }
    header.entete nav { margin-left: auto; }
    header.entete nav a {
      color: var(--accent); text-decoration: none; font-weight: 600;
      margin-left: 1.25rem; font-size: .95rem;
    }
    header.entete nav a:hover { text-decoration: underline; }
    .carte {
      background: var(--carte);
      border: 1px solid var(--bord);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px rgba(53, 63, 56, .08);
    }
    .bandeau {
      border-radius: 10px; padding: .8rem 1rem; margin-bottom: 1.25rem;
      font-size: .95rem;
    }
    .bandeau-succes {
      background: var(--succes-fond); border: 1px solid var(--succes-bord);
      color: var(--succes-texte);
    }
    .bandeau-succes a { color: inherit; font-weight: 600; }
    .bandeau-erreur {
      background: var(--erreur-fond); border: 1px solid var(--erreur-bord);
      color: var(--erreur-texte);
    }
    fieldset { border: none; padding: 0; margin: 0 0 1.5rem; }
    legend {
      font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--accent); font-weight: 600; margin-bottom: .6rem;
    }
    .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
    label { display: block; font-size: .9rem; margin-bottom: .3rem; color: var(--encre); }
    input, select, textarea {
      width: 100%; padding: .5rem .65rem;
      border: 1px solid var(--bord); border-radius: 8px;
      font: inherit; color: var(--encre); background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    }
    .message-erreur { color: var(--erreur-texte); font-size: .82rem; margin-top: .25rem; }
    .champ-erreur input, .champ-erreur select {
      border-color: var(--erreur-bord); background: var(--erreur-fond);
    }
    .aide { color: var(--encre-doux); font-size: .82rem; margin-top: .25rem; }
    textarea { resize: vertical; min-height: 4.5rem; }
    .actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    button.primaire {
      background: var(--sapin); color: #FBFBF9; border: none;
      border-radius: 8px; padding: .6rem 1.4rem; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    button.primaire:hover { background: var(--sapin-fonce); }
    a.discret { color: var(--encre-doux); font-size: .9rem; }
    h2.section { font-size: 1.05rem; margin: 0 0 .75rem; }
    .entete-formulaire {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: .75rem;
    }
    .entete-formulaire h2.section { margin-bottom: 0; }
    /* Saisie à gauche, liste des événements à droite. */
    .disposition {
      display: grid; grid-template-columns: minmax(300px, 4fr) minmax(0, 10fr);
      gap: 1.25rem; align-items: start;
    }
    /* Sans formulaire affiché, la liste occupe toute la largeur. */
    .disposition.sans-formulaire { grid-template-columns: 1fr; }
    /* min-width: 0 évite que le contenu d'une colonne (formulaire,
       tableau) n'impose sa largeur minimale à toute la grille. */
    .colonne-saisie, .colonne-liste { min-width: 0; }
    .colonne-saisie > .carte, .colonne-liste > .carte { margin-bottom: 0; }
    .visuellement-cache {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap;
    }
    /* Barre de filtres au-dessus de la liste. */
    .filtres {
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      margin-bottom: .9rem;
    }
    .filtres input { width: 8.5rem; padding: .35rem .55rem; font-size: .88rem; }
    button.secondaire {
      background: var(--carte); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 8px;
      padding: .35rem .9rem; font: inherit; font-size: .88rem;
      font-weight: 600; cursor: pointer;
    }
    button.secondaire:hover { background: var(--fond); }
    th a.tri { color: inherit; text-decoration: none; }
    th a.tri:hover { color: var(--accent); text-decoration: underline; }
    .fleche { font-size: .7rem; }
    td.actions-ligne a { margin-right: .6rem; }
    .encre-doux { color: var(--encre-doux); }
    .bloc-liste { margin-bottom: 1.75rem; }
    .bloc-liste h3 { font-size: .95rem; margin: 0 0 .5rem; }
    .en-ligne { display: inline-flex; gap: .4rem; align-items: center; }
    .en-ligne input { width: 10rem; padding: .35rem .55rem; font-size: .88rem; }
    .ajout-liste { margin-top: .75rem; }
    button.discret-bouton {
      background: none; color: var(--encre-doux);
      border: 1px solid var(--bord); border-radius: 8px;
      padding: .35rem .9rem; font: inherit; font-size: .88rem; cursor: pointer;
    }
    button.discret-bouton:hover { color: var(--erreur-texte); border-color: var(--erreur-bord); }
    .defilement { overflow-x: auto; }
    table {
      border-collapse: collapse; width: 100%; min-width: 42rem; font-size: .85rem;
    }
    th, td {
      text-align: left; padding: .35rem .45rem;
      border-bottom: 1px solid var(--bord);
      white-space: nowrap;
    }
    /* Le texte des cellules peut passer à la ligne pour que le tableau
       tienne dans sa colonne ; les liens Modifier / Supprimer se
       superposent naturellement. */
    td.actions-ligne { white-space: normal; }
    td.actions-ligne a { display: block; margin: .12rem 0; }
    th { color: var(--encre-doux); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; }
    /* La colonne commentaire est limitée par un div interne : en
       table-layout auto, max-width sur la cellule elle-même est ignoré,
       mais un bloc avec max-width contraint bien la largeur de colonne. */
    td.commentaire { white-space: normal; }
    td.commentaire > div {
      max-width: 22rem; overflow-wrap: break-word;
    }
    td a { color: var(--accent); text-decoration: none; font-weight: 600; }
    td a:hover { text-decoration: underline; }
    .vide { color: var(--encre-doux); font-size: .9rem; }
    .pagination {
      display: flex; gap: 1rem; align-items: center; justify-content: center;
      margin-top: .75rem; font-size: .88rem; color: var(--encre-doux);
    }
    .pagination a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .pagination a:hover { text-decoration: underline; }
    .bouton-ajouter {
      display: inline-block; background: var(--sapin); color: #FBFBF9;
      border-radius: 8px; padding: .5rem 1.2rem; font-weight: 600;
      text-decoration: none; margin-bottom: .75rem; font-size: .95rem;
    }
    .bouton-ajouter:hover { background: var(--sapin-fonce); }
    @media (max-width: 1100px) {
      .disposition { grid-template-columns: 1fr; }
    }
    .pied-de-page {
      margin-top: 2.5rem; padding-top: 1.25rem;
      border-top: 1px solid var(--bord); text-align: center;
    }
    .pied-de-page img { width: 132px; height: auto; opacity: .92; }
    @media (max-width: 640px) {
      .conteneur { padding: 1rem .75rem 2rem; }
      .carte { padding: 1rem; }
      header.entete nav { margin-left: 0; }
      header.entete nav a { margin-left: 0; margin-right: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="conteneur">
    <header class="entete">
      <h1><img class="pictogramme" src="/static/favicon.png" alt="" aria-hidden="true">Suivi d'activité{% if version %} <span style="font-size: 0.8em; color: var(--encre-doux);">(v{{ version }} - <a href="{{ url_changelog }}" target="_blank" rel="noopener" style="color: inherit;">changements</a>)</span>{% endif %}</h1>
      <span class="sous-titre">saisie des contacts et prospects</span>
      <nav>
        <a href="/">Saisie</a>
        <a href="/kpi">KPI</a>
        <a href="/listes">Listes</a>
      </nav>
    </header>
    {% block contenu %}{% endblock %}
    <footer class="pied-de-page">
      <img src="/static/logo-primaire.png" alt="Cécile Plessis — photographie • studio">
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>

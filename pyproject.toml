[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi"
dynamic = ["version"]
description = "Outil de saisie d'activité et de restitution des KPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "setuptools-scm>=8.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pycodestyle>=2.12",
]

[project.scripts]
kpi = "kpi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-scm]
# Utiliser les tags git pour la version (format : v1.2.3 ou 1.2.3)
# Si aucun tag, utilise la distance depuis le dernier tag + hash
version_scheme = "post-release"
local_scheme = "dirty-tag"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi"
version = "0.1.0"
description = "Outil de saisie d'activité et de restitution des KPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
kpi = "kpi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

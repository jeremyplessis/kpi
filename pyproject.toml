[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi"
version = "0.1.0"
description = "Outil de saisie d'activité et de restitution des KPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pycodestyle>=2.12",
]

[project.scripts]
kpi = "kpi.app:main"

[tool.setuptools.packages.find]
where = ["src"]
